name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tmux and git
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tmux git

      - name: Smoke test (API)
        run: python3 tests/smoke.py

      - name: Update check
        run: python3 tests/test_updates.py

      - name: JavaScript syntax
        run: python3 tests/check_js.py static/*.js site/demo/*.js site/assets/*.js

      - name: Website build
        run: python3 tools/build_site.py

      - name: Installer syntax
        run: bash -n install.sh
