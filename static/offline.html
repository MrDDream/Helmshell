<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4FBF8">
<title>Helmshell · unreachable</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #F4FBF8; --card: #FFFFFF; --text: #161D1B; --muted: #3F4946; --accent: #1F4E79; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1513; --card: #1A2120; --text: #DDE4E1; --muted: #BEC9C5; --accent: #9CC7F0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 420px; text-align: center; background: var(--card); border-radius: 28px; padding: 32px 28px; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 22px; font-weight: 600; margin: 16px 0 8px; }
  p { margin: 0 0 20px; color: var(--muted); }
  .fr { margin-top: -12px; font-size: 14px; }
  h1.fr { font-size: 17px; margin: 0 0 8px; }
  a { display: inline-block; padding: 10px 24px; border-radius: 20px; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="">
  <h1>The server is out of reach</h1>
  <p>Helmshell can’t reach your server. Check that you’re on the local network or the VPN, then try again.</p>
  <h1 class="fr" lang="fr">Le serveur est hors de portée</h1>
  <p class="fr" lang="fr">Helmshell n’arrive pas à joindre ton serveur. Vérifie que tu es sur le réseau local ou sur le VPN, puis réessaie.</p>
  <a href="/">Try again · Réessayer</a>
</main>
</body>
</html>
